{% extends "base.html" %}
{% load kantin %}
{% block nav %}
  <div class="flex-1"></div>
  <div class="flex items-center gap-1">
    <a class="btn btn-ghost btn-sm hidden sm:inline-flex" href="{% url 'customer:kantin' %}">Kantin</a>
    <a class="btn btn-ghost btn-sm" href="{% url 'customer:pesanan' %}">Pesanan</a>
    <a class="btn btn-primary btn-sm" href="{% url 'customer:keranjang' %}">
      Keranjang
      {% jumlah_keranjang as n %}{% if n %}<span class="badge badge-sm">{{ n }}</span>{% endif %}
    </a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'customer:keluar' %}">{% csrf_token %}
        <button class="btn btn-ghost btn-sm">Keluar</button>
      </form>
    {% else %}
      <a class="btn btn-ghost btn-sm" href="{% url 'customer:masuk' %}">Masuk</a>
    {% endif %}
  </div>
{% endblock %}
