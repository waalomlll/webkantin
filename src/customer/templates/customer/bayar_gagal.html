{% extends "customer/_dasar.html" %}
{% load kantin %}
{% block title %}Pembayaran gagal — Kantin ITB{% endblock %}
{% block content %}
  <div class="card bg-base-100 shadow-sm max-w-md mx-auto">
    <div class="card-body items-center text-center gap-3">
      <div class="text-5xl">⚠️</div>
      <h1 class="card-title">Pembayaran gagal</h1>
      <p class="opacity-70">Pesanan belum dibuat dan tidak ada dana yang terpotong. Total {{ total|rupiah }}.</p>
      <div class="flex gap-2 w-full">
        <a href="{% url 'customer:bayar' %}" class="btn btn-primary flex-1">Coba lagi</a>
        <form method="post" action="{% url 'customer:bayar_batal' %}" class="flex-1">{% csrf_token %}
          <button class="btn btn-outline w-full">Batalkan</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
